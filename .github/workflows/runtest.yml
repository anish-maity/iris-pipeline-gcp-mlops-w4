name: CI Iris Pipeline Test (GCS)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

# MODIFICATION 1: Permissions updated for Google Cloud authentication
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Set up DVC
        uses: iterative/setup-dvc@v1

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # MODIFICATION 2: Replaced SSH key step with Google Cloud authentication
      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # MODIFICATION 3: DVC pull command now points to the GCS remote
      - name: Fetch DVC Data and Model
        run: |
          dvc pull --remote gcsremote

      - name: Run Tests with Pytest
        run: |
          pytest 2>&1 | tee test_report.txt

      - name: Create CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧪 CI Test Report (Storage: GCS)" > report.md
          echo "Branch: \${{ github.ref_name }}\" >> report.md
          echo "" >> report.md
          
          echo "### 📊 Model Metrics" >> report.md
          echo '
          cat metrics.csv >> report.md
          echo '
' >> report.md

          echo "### ✅ Test Results" >> report.md
          echo '
          cat test_report.txt >> report.md
          echo '
' >> report.md
          
          cml comment create --publish report.md
